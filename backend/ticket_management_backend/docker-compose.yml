services:

  db:
    image: postgres:17
    container_name: ticket-management-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_management

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: ticket-management-redis

    ports:
      - "6379:6379"


  backend:
    image: ticket-management-backend:latest
    container_name: ticket-management-backend

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis


volumes:
  postgres_data: