services:

  db:
    image: postgres:17
    container_name: ticket-management-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_management

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: ticket-management-redis

    ports:
      - "6379:6379"


  backend:

    build:
      context: .
      dockerfile: Dockerfile

    image: ticket-management-backend:latest
    container_name: ticket-management-backend

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ticket_management
      REDIS_URL: redis://redis:6379

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis


volumes:
  postgres_data: